# Checks jheem2 as a package on Linux, macOS and Windows on every push and pull request that
# touches it: R CMD check, which also runs tests/*.R, and that NAMESPACE and the help pages match
# the roxygen comments in R/. An error in either fails the run; warnings and notes are reported in
# the check log. Releases are cut only from commits whose checks passed (release.yml).
name: Check

on:
  push:
    paths:
      - 'R/**'
      - 'src/**'
      - 'tests/**'
      - 'man/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.Rbuildignore'
      - '.github/workflows/check.yml'
  pull_request:
    paths:
      - 'R/**'
      - 'src/**'
      - 'tests/**'
      - 'man/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.Rbuildignore'
      - '.github/workflows/check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: R CMD check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # DESCRIPTION's Remotes field resolves locations, distributions and bayesian.simulations
      # from GitHub.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          error-on: '"error"'
          upload-snapshots: false

  docs:
    name: Help pages match the code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # The roxygen2 version is DESCRIPTION's RoxygenNote, so the pages it writes are comparable.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: roxygen2@7.3.2

      - name: Regenerate NAMESPACE and the help pages
        run: Rscript -e 'roxygen2::roxygenise()'

      - name: Fail if they differ from the committed ones
        run: |
          changes="$(git status --porcelain -- NAMESPACE man)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::NAMESPACE or man/ differ from the roxygen comments. Run roxygen2::roxygenise() (roxygen2 7.3.2) and commit the result."
            exit 1
          fi
