# Installs jheem2 and runs its tests/*.R on every push that touches the package.
# Informational, not a required check. The integration gate stays the pinned
# SHIELD runtime image (jheem-containers, shield-spike.yml with jheem2_test_ref).
name: Tests

on:
  push:
    paths:
      - 'R/**'
      - 'src/**'
      - 'tests/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # DESCRIPTION's Imports omit packages the code uses (R6 above all, which
      # installation itself needs), and locations and distributions come from
      # GitHub, so they are listed here.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::R6
            any::mvtnorm
            any::scales
            any::stringr
            github::tfojo1/locations
            github::tfojo1/distributions

      - name: Install jheem2
        run: |
          mkdir -p "$RUNNER_TEMP/jheem2-lib"
          R CMD INSTALL --no-docs --no-multiarch --library="$RUNNER_TEMP/jheem2-lib" .

      - name: Run tests/*.R
        env:
          JHEEM2_TEST_LIBRARY: ${{ runner.temp }}/jheem2-lib
        run: |
          for test in tests/*.R; do
            echo "== $test"
            Rscript "$test"
          done
